name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest and a browser
        run: |
          pip install pytest playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Smoke test against the production server
        env:
          SITE_URL: http://127.0.0.1:3100/
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3100/ >/dev/null && break; sleep 1; done
          python -m pytest -q tests
